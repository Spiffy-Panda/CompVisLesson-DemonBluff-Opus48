name: Deploy site to GitHub Pages

# Publishes the static site/ directory to GitHub Pages. The project Pages URL is
# a subdirectory of the user's Pages domain:
#   https://spiffy-panda.github.io/CompVisLesson-DemonBluff-Opus48/
# The same site/ is served locally by utils/python/serve_site.py. All links in
# the site are relative, so it works at both "/" (local) and "/<repo>/" (Pages).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; let an in-progress run finish rather than cancel it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # auto-enable Pages (Actions source) on first run so no manual setup is needed
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
